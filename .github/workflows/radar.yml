name: Radar social listening

on:
  workflow_dispatch:
  schedule:
    - cron: '40 10 * * *'
  push:
    branches: [claude/radar-social-listening]
    paths: ['radar/**', '.github/workflows/radar.yml']

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  collect-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      # El almacén con textos de publicaciones no se sube al repositorio: vive en la caché del workflow.
      - name: Restore post store
        uses: actions/cache/restore@v4
        with:
          path: radar/.store
          key: radar-store-${{ github.run_id }}
          restore-keys: radar-store-
      - name: Collect public posts
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python radar/collect.py
      - name: Save post store
        if: always()
        uses: actions/cache/save@v4
        with:
          path: radar/.store
          key: radar-store-${{ github.run_id }}
      - name: Analyze
        env:
          RADAR_SALT: ${{ secrets.RADAR_SALT }}
        run: python radar/analyze.py
      - name: Show collection status
        if: always()
        run: cat radar/.store/collect_status.json || true
      - name: Commit public aggregates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar/data
          if ! git diff --cached --quiet; then
            git commit -m 'Radar: actualizar agregados públicos'
            # Si alguien empujó a la rama durante la corrida, se integra y se conserva el radar.json recién calculado
            for i in 1 2 3; do
              git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push && exit 0
              sleep $((i * 5))
            done
            exit 1
          fi
